<!DOCTYPE html>
<html lang="af">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HWKV</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- LOGIN SCREEN -->
  <div id="loginScreen" class="login-screen active">
    <div class="login-card">
      <div class="logo-mark">HWKV</div>
      <p class="login-subtitle" data-en="Enter your member code" data-afr="Voer jou ledekode in">Voer jou ledekode in</p>
      <input type="text" id="memberCode" placeholder="bv. PRIM-LAC-0" autocomplete="off" autocapitalize="characters">
      <p id="loginError" class="error-text"></p>
      <button id="loginBtn" class="btn-primary" data-en="Enter" data-afr="Toegang">Toegang</button>
    </div>
  </div>

  <!-- PORTAL SCREEN -->
  <div id="portalScreen" class="portal-screen">
    <header class="portal-header">
      <div class="logo-mark small">HWKV</div>
      <div class="member-info">
        <span id="memberName"></span>
        <span id="memberCodeDisplay" class="member-code-badge"></span>
      </div>
    </header>

    <main class="portal-main">

      <!-- MESSAGES -->
      <section class="portal-section">
        <h2 class="section-title" data-en="Messages" data-afr="Boodskappe">Boodskappe</h2>
        <div id="messagesContainer"></div>
      </section>

      <!-- POLLS / AVAILABILITY -->
      <section class="portal-section" id="pollsSection" style="display:none">
        <h2 class="section-title" data-en="Availability" data-afr="Beskikbaarheid">Beskikbaarheid</h2>
        <div id="pollsContainer"></div>
      </section>

      <!-- TASTINGS -->
      <section class="portal-section">
        <h2 class="section-title" data-en="Upcoming Tastings" data-afr="Aanstaande Proeë">Aanstaande Proeë</h2>
        <div id="tastingsContainer"></div>
      </section>

    </main>
  </div>

  <script src="js/config.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
