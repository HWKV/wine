<!DOCTYPE html>
<html lang="af">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HWKV Admin</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="admin.css">
</head>
<body>

  <!-- LOGIN -->
  <div id="adminLogin" class="login-screen">
    <div class="login-card">
      <div class="logo-mark">HWKV</div>
      <h2>Administrateur</h2>
      <input type="password" id="adminPass" placeholder="Wagwoord">
      <p id="adminLoginErr" class="error-text"></p>
      <button id="adminLoginBtn" class="btn-primary">Toegang</button>
    </div>
  </div>

  <!-- DASHBOARD -->
  <div id="adminDash" style="display:none">
    <header class="admin-header">
      <span class="logo-mark small">HWKV</span>
      <span class="admin-title">Bestuurspaneel</span>
    </header>

    <nav class="tab-nav">
      <button class="tab-btn" data-tab="members">Lede</button>
      <button class="tab-btn" data-tab="tastings">Proeë</button>
      <button class="tab-btn" data-tab="messages">Boodskappe</button>
      <button class="tab-btn" data-tab="polls">Peile</button>
      <button class="tab-btn" data-tab="rsvps">RSVPs</button>
      <button class="tab-btn" data-tab="finance">Finansies</button>
      <button class="tab-btn" data-tab="email">E-pos</button>
    </nav>

    <!-- MEMBERS -->
    <div id="tab-members" class="tab-content" style="display:none">
      <h2>Ledelys</h2>
      <table class="admin-table">
        <thead>
          <tr><th>#</th><th>Naam</th><th>Kode</th><th>Kamer</th><th>Tipe</th><th>E-pos</th><th></th></tr>
        </thead>
        <tbody id="membersTableBody"></tbody>
      </table>
    </div>

    <!-- TASTINGS -->
    <div id="tab-tastings" class="tab-content" style="display:none">
      <h2>Proeëbestuur</h2>
      <div id="tastingsAdmin"></div>
    </div>

    <!-- MESSAGES -->
    <div id="tab-messages" class="tab-content" style="display:none">
      <h2>Boodskappe</h2>
      <div id="messagesAdmin"></div>
    </div>

    <!-- POLLS -->
    <div id="tab-polls" class="tab-content" style="display:none">
      <h2>Beskikbaarheidspeil</h2>
      <div id="pollsAdmin"></div>
    </div>

    <!-- RSVPs -->
    <div id="tab-rsvps" class="tab-content" style="display:none">
      <h2>RSVPs</h2>
      <div id="rsvpsAdmin"></div>
    </div>

    <!-- FINANCE -->
    <div id="tab-finance" class="tab-content" style="display:none">
      <h2>Finansiële Berekening</h2>
      <div id="financeAdmin"></div>
    </div>

    <!-- EMAIL -->
    <div id="tab-email" class="tab-content" style="display:none">
      <h2>E-pos</h2>
      <div id="emailAdmin"></div>
    </div>

  </div>

  <script src="../js/config.js"></script>
  <script src="admin.js"></script>
</body>
</html>
